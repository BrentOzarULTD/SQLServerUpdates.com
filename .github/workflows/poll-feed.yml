name: Poll Microsoft sources for new builds

# Every 6 hours, check the Microsoft SQL Server blog RSS feed and latest-updates
# table for new build releases, then open a pull request with any new builds for
# a human to review and merge. Never publishes unreviewed.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      diagnose_api:
        description: "Test OpenAI access without changing site data"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnose-api:
    if: inputs.diagnose_api == true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Diagnose OpenAI API access
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 poll_feed.py --diagnose-api

  poll:
    if: inputs.diagnose_api != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Test release processing
        run: python3 -m unittest test_releases.py

      - name: Poll Microsoft sources and extract new builds
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 poll_feed.py

      - name: Detect data changes
        id: detect
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate, build, and verify the proposed change
        if: steps.detect.outputs.changed == 'true'
        run: |
          python3 validate.py
          python3 build.py
          python3 test_snapshot.py

      - name: Open pull request
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: data
          branch: bot/new-sql-builds
          base: main
          title: "New SQL Server build(s) from Microsoft sources"
          body-path: pr_body.md
          commit-message: "Add new SQL Server build(s) from Microsoft sources"
          labels: automated, needs-review
          assignees: BrentOzar
          reviewers: BrentOzar
          delete-branch: true
